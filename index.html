<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recorrido VR EE.UU.</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    
    #contenedor-vr {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    .ojo-izquierdo, .ojo-derecho {
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    .ojo-izquierdo {
      border-right: 2px solid #000;
    }
  </style>
</head>
<body>

  <div id="contenedor-vr">
    <!-- Vista Ojo Izquierdo -->
    <div class="ojo-izquierdo">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-assets>
          <img id="lugar1" src="foto1.jpg">
          <img id="lugar2" src="foto2.jpg">
          <img id="lugar3" src="foto3.jpg">
        </a-assets>
        <a-sky class="fondo-escena" src="#lugar1" rotation="0 -90 0"></a-sky>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>

    <!-- Vista Ojo Derecho -->
    <div class="ojo-derecho">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-sky class="fondo-escena" src="#lugar1" rotation="0 -90 0"></a-sky>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>
  </div>

  <script>
    // Control sincrónico con el mando de PS4 para ambas vistas
    const estaciones = ["#lugar1", "#lugar2", "#lugar3"];
    let indiceActual = 0;
    let botonPresionado = false;

    function revisarMando() {
      const gamepads = navigator.getGamepads();
      if (gamepads && gamepads[0]) {
        const mando = gamepads[0];
        const botonX = mando.buttons[0]; 

        if (botonX && botonX.pressed && !botonPresionado) {
          botonPresionado = true;
          indiceActual = (indiceActual + 1) % estaciones.length;
          
          // Actualizar las dos escenas al mismo tiempo
          const fondos = document.querySelectorAll('.fondo-escena');
          fondos.forEach(fondo => {
            fondo.setAttribute("src", estaciones[indiceActual]);
          });

        } else if (botonX && !botonX.pressed) {
          botonPresionado = false;
        }
      }
      requestAnimationFrame(revisarMando);
    }

    window.addEventListener("gamepadconnected", () => {
      revisarMando();
    });
  </script>
</body>
</html>
