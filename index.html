<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recorrido VR - Estatua de la Libertad</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    
    /* Contenedor de pantalla dividida estéreo */
    #contenedor-vr {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    .ojo {
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    .ojo:first-child {
      border-right: 2px solid #000;
    }

    /* Botón flotante para iniciar reproducción */
    #boton-play {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: #ff3b30;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="boton-play" onclick="iniciarExperiencia()">▶ Toca aquí para iniciar el video</button>

  <!-- Video apuntando a video1.mp4 -->
  <video id="video-360" src="video1.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline style="display:none;"></video>

  <div id="contenedor-vr">
    <!-- Ojo Izquierdo -->
    <div class="ojo">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>

    <!-- Ojo Derecho -->
    <div class="ojo">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>
  </div>

  <script>
    const video = document.getElementById('video-360');
    const botonPlay = document.getElementById('boton-play');
    let reproduciendo = false;

    function iniciarExperiencia() {
      if (!reproduciendo) {
        video.play().then(() => {
          reproduciendo = true;
          botonPlay.textContent = "⏸ Pausar Video";
        }).catch(err => {
          console.log("Error al reproducir el video:", err);
          alert("No se pudo reproducir. Asegúrate de que el archivo 'video1.mp4' esté subido en GitHub.");
        });
      } else {
        if (video.paused) {
          video.play();
          botonPlay.textContent = "⏸ Pausar Video";
        } else {
          video.pause();
          botonPlay.textContent = "▶ Reproducir Video";
        }
      }

      // Conceder permisos de giroscopio en iOS
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(console.error);
      }
    }

    // Control opcional con el botón X del mando de PS4
    let botonPresionado = false;
    function revisarMando() {
      const gamepads = navigator.getGamepads();
      if (gamepads && gamepads[0]) {
        const mando = gamepads[0];
        const botonX = mando.buttons[0]; 

        if (botonX && botonX.pressed && !botonPresionado) {
          botonPresionado = true;
          iniciarExperiencia();
        } else if (botonX && !botonX.pressed) {
          botonPresionado = false;
        }
      }
      requestAnimationFrame(revisarMando);
    }

    window.addEventListener("gamepadconnected", () => {
      revisarMando();
    });
  </script>
</body>
</html>
