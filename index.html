<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recorrido VR - EE.UU.</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    /* Pantalla 1: Título y Banderas con transición animada */
    #pantalla-titulo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #1a1a2e 0%, #000000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: white;
      text-align: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #pantalla-titulo.ocultar {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    #pantalla-titulo h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      color: #ff3b30;
      text-shadow: 0 0 10px rgba(255, 59, 48, 0.5);
    }

    .banderas {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    #pantalla-titulo p {
      font-size: 1.2rem;
      color: #ccc;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Pantalla 2: Menú de Selección (4 Cuadros) */
    #menu-principal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99998;
      color: white;
    }

    .grid-cuadros {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .cuadro {
      width: 180px;
      height: 120px;
      background: #222;
      border: 3px solid #555;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      padding: 10px;
      transition: 0.2s;
    }

    .cuadro.activo {
      border-color: #ff3b30;
      background: #331111;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 59, 48, 0.6);
    }

    #instruccion-menu {
      margin-top: 25px;
      font-size: 15px;
      color: #aaa;
    }

    /* Pantalla 3: Reproductor VR en Pantalla Dividida Estéreo forzada */
    #contenedor-vr {
      display: none;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: #000;
      z-index: 99997;
    }
    
    .ojo-dual {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .ojo {
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    .ojo:first-child {
      border-right: 2px solid #111;
    }
  </style>
</head>
<body>

  <!-- 1. PANTALLA DE INICIO (TÍTULO Y BANDERAS) -->
  <div id="pantalla-titulo" onclick="irAlMenu()">
    <div class="banderas">🇺🇸 🗽 🇺🇸</div>
    <h1>RECORRIDO VR</h1>
    <p>Presiona el botón <b>OPTIONS (Start)</b> del mando</p>
  </div>

  <!-- 2. MENÚ PRINCIPAL DE 4 CUADROS -->
  <div id="menu-principal">
    <h2>SELECCIONA UN DESTINO</h2>
    <div class="grid-cuadros">
      <div class="cuadro activo" id="c0">1. Estatua de la Libertad</div>
      <div class="cuadro" id="c1">2. Monumento a Washington</div>
      <div class="cuadro" id="c2">3. Próximamente</div>
      <div class="cuadro" id="c3">4. Próximamente</div>
    </div>
    <div id="instruccion-menu">Usa la cruceta/joystick para moverte y presiona <b>X</b> para entrar</div>
  </div>

  <!-- 3. REPRODUCTOR DE VIDEO VR EN PANTALLA DIVIDIDA ESTÉREO -->
  <div id="contenedor-vr">
    <div class="ojo-dual">
      <!-- Ojo Izquierdo -->
      <div class="ojo">
        <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
          <a-videosphere id="v-sphere-left" rotation="0 -90 0"></a-videosphere>
          <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
        </a-scene>
      </div>

      <!-- Ojo Derecho -->
      <div class="ojo">
        <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
          <a-videosphere id="v-sphere-right" rotation="0 -90 0"></a-videosphere>
          <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
        </a-scene>
      </div>
    </div>
  </div>

  <!-- Elemento de video oculto -->
  <video id="video-reproductor" crossorigin="anonymous" playsinline webkit-playsinline style="display:none;"></video>

  <script>
    const pantallaTitulo = document.getElementById('pantalla-titulo');
    const menuPrincipal = document.getElementById('menu-principal');
    const contenedorVr = document.getElementById('contenedor-vr');
    const video = document.getElementById('video-reproductor');
    const vSphereLeft = document.getElementById('v-sphere-left');
    const vSphereRight = document.getElementById('v-sphere-right');

    let estadoActual = "TITULO"; // "TITULO", "MENU", "VR"
    let seleccionActual = 0;
    const totalCuadros = 4;

    const videosDestinos = [
      "video3.mp4", // Cuadro 1 (Estatua de la Libertad)
      "video4.mp4", // Cuadro 2
      "video5.mp4", // Cuadro 3
      "video6.mp4"  // Cuadro 4
    ];

    function actualizarMenuVisual() {
      for (let i = 0; i < totalCuadros; i++) {
        const el = document.getElementById('c' + i);
        if (i === seleccionActual) {
          el.classList.add('activo');
        } else {
          el.classList.remove('activo');
        }
      }
    }

    function irAlMenu() {
      if (estadoActual !== "TITULO") return;
      // Activar animación de desvanecimiento
      pantallaTitulo.classList.add('ocultar');
      
      setTimeout(() => {
        pantallaTitulo.style.display = 'none';
        menuPrincipal.style.display = 'flex';
        estadoActual = "MENU";
      }, 600); // Coincide con la duración de la transición CSS
    }

    function seleccionarDestino(index) {
      const videoFile = videosDestinos[index];
      
      // Validar si el video está disponible (solo el cuadro 0 / video3.mp4)
      if (index > 0) {
        alert("Este destino (" + videoFile + ") estará disponible próximamente.");
        return;
      }

      estadoActual = "VR";
      menuPrincipal.style.display = 'none';
      contenedorVr.style.display = 'block'; // Fuerza la aparición de la pantalla dividida estéreo

      video.src = videoFile;
      video.play().then(() => {
        vSphereLeft.setAttribute("src", "#video-reproductor");
        vSphereRight.setAttribute("src", "#video-reproductor");
      }).catch(err => {
        console.log("Error al reproducir el video:", err);
        alert("Asegúrate de que el archivo 'video3.mp4' esté bien subido en GitHub y codificado en formato compatible (H.264).");
        regresarAlMenu();
      });

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(console.error);
      }
    }

    video.addEventListener('ended', () => {
      regresarAlMenu();
    });

    function regresarAlMenu() {
      video.pause();
      video.src = "";
      contenedorVr.style.display = 'none';
      menuPrincipal.style.display = 'flex';
      estadoActual = "MENU";
    }

    // Control por mando de PS4
    let btnXPronto = false;
    let btnOptionsPronto = false;
    let dpadAbajoPronto = false;
    let dpadArribaPronto = false;
    let dpadIzquierdaPronto = false;
    let dpadDerechaPronto = false;

    function bucleMandoPS4() {
      const gamepads = navigator.getGamepads();
      if (gamepads && gamepads[0]) {
        const m = gamepads[0];
        
        // Botón OPTIONS (Start) - Índice 9 o 3
        const btnOptions = m.buttons[9] || m.buttons[3];
        if (btnOptions && btnOptions.pressed && !btnOptionsPronto) {
          btnOptionsPronto = true;
          if (estadoActual === "TITULO") {
            irAlMenu();
          }
        } else if (btnOptions && !btnOptions.pressed) {
          btnOptionsPronto = false;
        }

        // Botón X (Cruz) - Índice 0
        const botonX = m.buttons[0];
        if (botonX && botonX.pressed && !btnXPronto) {
          btnXPronto = true;
          if (estadoActual === "MENU") {
            seleccionarDestino(seleccionActual);
          }
        } else if (botonX && !botonX.pressed) {
          btnXPronto = false;
        }

        // Navegación en el menú con cruceta o joystick
        if (estadoActual === "MENU") {
          const axisY = m.axes[1];
          const axisX = m.axes[0];

          // Abajo
          if ((m.buttons[13] && m.buttons[13].pressed || axisY > 0.5) && !dpadAbajoPronto) {
            dpadAbajoPronto = true;
            if (seleccionActual < 2) seleccionActual += 2;
            actualizarMenuVisual();
          } else if (!(m.buttons[13] && m.buttons[13].pressed) && axisY <= 0.5) {
            dpadAbajoPronto = false;
          }

          // Arriba
          if ((m.buttons[12] && m.buttons[12].pressed || axisY < -0.5) && !dpadArribaPronto) {
            dpadArribaPronto = true;
            if (seleccionActual >= 2) seleccionActual -= 2;
            actualizarMenuVisual();
          } else if (!(m.buttons[12] && m.buttons[12].pressed) && axisY >= -0.5) {
            dpadArribaPronto = false;
          }

          // Derecha
          if ((m.buttons[15] && m.buttons[15].pressed || axisX > 0.5) && !dpadDerechaPronto) {
            dpadDerechaPronto = true;
            if (seleccionActual % 2 === 0) seleccionActual += 1;
            actualizarMenuVisual();
          } else if (!(m.buttons[15] && m.buttons[15].pressed) && axisX <= 0.5) {
            dpadDerechaPronto = false;
          }

          // Izquierda
          if ((m.buttons[14] && m.buttons[14].pressed || axisX < -0.5) && !dpadIzquierdaPronto) {
            dpadIzquierdaPronto = true;
            if (seleccionActual % 2 === 1) seleccionActual -= 1;
            actualizarMenuVisual();
          } else if (!(m.buttons[14] && m.buttons[14].pressed) && axisX <= 0.5) {
            dpadIzquierdaPronto = false;
          }
        }
      }
      requestAnimationFrame(bucleMandoPS4);
    }

    window.addEventListener("gamepadconnected", () => {
      bucleMandoPS4();
    });
  </script>
</body>
</html>
