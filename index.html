<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recorrido VR - Estatua de la Libertad</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    
    /* Contenedor estéreo simétrico para las BOBOVR Z4 */
    #vista-estereo {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none; /* Permite que los clics pasen a la escena */
    }
    .ojo-lente {
      width: 50vw;
      height: 100vh;
      border-right: 2px solid #000;
      box-sizing: border-box;
    }

    /* Botón flotante superior para arrancar el video sí o sí en iOS */
    #btn-iniciar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: #ff3b30;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Botón obligatorio para saltarse la seguridad de reproducción de iOS -->
  <button id="btn-iniciar" onclick="comenzarVR()">▶ Tocar para Iniciar Video VR</button>

  <a-scene embedded vr-mode-ui="enabled: false" style="width: 100vw; height: 100vh;">
    <a-assets>
      <video id="video-360" src="video1.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
    <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
  </a-scene>

  <!-- Máscara visual de pantalla dividida estéreo -->
  <div id="vista-estereo">
    <div class="ojo-lente"></div>
    <div class="ojo-lente"></div>
  </div>

  <script>
    const video = document.getElementById('video-360');
    const boton = document.getElementById('btn-iniciar');
    let enReproduccion = false;

    function comenzarVR() {
      if (!enReproduccion) {
        video.play().then(() => {
          enReproduccion = true;
          boton.style.display = 'none'; // Ocultar botón al iniciar
        }).catch(error => {
          console.log("Error al reproducir:", error);
          alert("El video no pudo iniciar. Comprueba que el archivo 'video1.mp4' esté bien subido en GitHub.");
        });
      } else {
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      }

      // Permisos obligatorios de giroscopio en iOS 13+
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(console.error);
      }
    }

    // Control con el botón X del mando de PS4
    let botonXPresionado = false;
    function revisarMandoPS4() {
      const gamepads = navigator.getGamepads();
      if (gamepads && gamepads[0]) {
        const mando = gamepads[0];
        const botonX = mando.buttons[0]; 

        if (botonX && botonX.pressed && !botonXPresionado) {
          botonXPresionado = true;
          comenzarVR();
        } else if (botonX && !botonX.pressed) {
          botonXPresionado = false;
        }
      }
      requestAnimationFrame(revisarMandoPS4);
    }

    window.addEventListener("gamepadconnected", () => {
      revisarMandoPS4();
    });
  </script>
</body>
</html>
