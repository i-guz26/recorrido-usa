<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recorrido VR - EE.UU.</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    /* Contenedor de pantalla dividida estéreo (Oculto en el menú principal) */
    #contenedor-vr {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    .ojo {
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    .ojo:first-child {
      border-right: 2px solid #000;
    }

    /* Interfaz del Menú de 4 Cuadros (Pantalla Completa antes de entrar en VR) */
    #menu-principal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: white;
    }

    .grid-cuadros {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .cuadro {
      width: 180px;
      height: 120px;
      background: #222;
      border: 3px solid #555;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      padding: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .cuadro.activo {
      border-color: #ff3b30;
      background: #331111;
    }

    #instruccion-inicio {
      margin-top: 25px;
      font-size: 16px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- MENÚ PRINCIPAL DE SELECCIÓN (4 CUADROS) -->
  <div id="menu-principal">
    <h2>SELECCIONA UN DESTINO VR</h2>
    <div class="grid-cuadros">
      <div class="cuadro activo" id="c0">1. Estatua de la Libertad</div>
      <div class="cuadro" id="c1">2. Monumento a Washington</div>
      <div class="cuadro" id="c2">3. Próximamente</div>
      <div class="cuadro" id="c3">4. Próximamente</div>
    </div>
    <div id="instruccion-inicio">Presiona el botón <b>OPTIONS (Start)</b> o la <b>X</b> para iniciar</div>
  </div>

  <!-- REPRODUCTOR DE VIDEO VR (Oculto hasta seleccionar destino) -->
  <div id="contenedor-vr">
    <!-- Ojo Izquierdo -->
    <div class="ojo">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-videosphere id="v-sphere-left" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0">
          <a-entity cursor="fuse: false; rayOrigin: mouse;"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                    material="color: white; shader: flat">
          </a-entity>
        </a-entity>
      </a-scene>
    </div>

    <!-- Ojo Derecho -->
    <div class="ojo">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-videosphere id="v-sphere-right" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>
  </div>

  <!-- Elemento de video oculto -->
  <video id="video-reproductor" crossorigin="anonymous" playsinline webkit-playsinline style="display:none;"></video>

  <script>
    const menuPrincipal = document.getElementById('menu-principal');
    const contenedorVr = document.getElementById('contenedor-vr');
    const video = document.getElementById('video-reproductor');
    const vSphereLeft = document.getElementById('v-sphere-left');
    const vSphereRight = document.getElementById('v-sphere-right');

    let seleccionActual = 0;
    const totalCuadros = 4;
    let enSimulacion = false;

    // Relación de cuadros con los videos solicitados
    const videosDestinos = [
      "video3.mp4", // Cuadro 1: Estatua de la Libertad (Funciona)
      "video4.mp4", // Cuadro 2 (Próximamente)
      "video5.mp4", // Cuadro 3 (Próximamente)
      "video6.mp4"  // Cuadro 4 (Próximamente)
    ];

    function actualizarMenuVisual() {
      for (let i = 0; i < totalCuadros; i++) {
        const el = document.getElementById('c' + i);
        if (i === seleccionActual) {
          el.classList.add('activo');
        } else {
          el.classList.remove('activo');
        }
      }
    }

    function seleccionarDestino(index) {
      const videoFile = videosDestinos[index];
      
      // Validar si el video existe (especialmente para los cuadros 2, 3 y 4 que aún no tienen archivo)
      if (index > 0) {
        alert("Este destino (" + videoFile + ") estará disponible próximamente.");
        return;
      }

      enSimulacion = true;
      menuPrincipal.style.display = 'none';
      contenedorVr.style.display = 'flex';

      video.src = videoFile;
      video.play().then(() => {
        vSphereLeft.setAttribute("src", "#video-reproductor");
        vSphereRight.setAttribute("src", "#video-reproductor");
      }).catch(err => {
        console.log("Error al reproducir:", err);
        alert("Asegúrate de que el archivo '" + videoFile + "' esté subido en GitHub.");
        regresarAlMenu();
      });

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(console.error);
      }
    }

    video.addEventListener('ended', () => {
      regresarAlMenu();
    });

    function regresarAlMenu() {
      video.pause();
      video.src = "";
      enSimulacion = false;
      contenedorVr.style.display = 'none';
      menuPrincipal.style.display = 'flex';
    }

    document.getElementById('menu-principal').addEventListener('click', () => {
      if (!enSimulacion) {
        seleccionarDestino(seleccionActual);
      }
    });

    let botonXPronto = false;
    let botonOptionsPronto = false;
    let dpadAbajoPronto = false;
    let dpadArribaPronto = false;

    function bucleMandoPS4() {
      const gamepads = navigator.getGamepads();
      if (gamepads && gamepads[0]) {
        const m = gamepads[0];
        
        const btnOptions = m.buttons[9] || m.buttons[3];
        if (btnOptions && btnOptions.pressed && !botonOptionsPronto) {
          botonOptionsPronto = true;
          if (!enSimulacion) {
            seleccionarDestino(seleccionActual);
          }
        } else if (btnOptions && !btnOptions.pressed) {
          botonOptionsPronto = false;
        }

        const botonX = m.buttons[0];
        if (botonX && botonX.pressed && !botonXPronto) {
          botonXPronto = true;
          if (!enSimulacion) {
            seleccionarDestino(seleccionActual);
          }
        } else if (botonX && !botonX.pressed) {
          botonXPronto = false;
        }

        if (!enSimulacion) {
          const axisY = m.axes[1];
          if ((m.buttons[13] && m.buttons[13].pressed || axisY > 0.5) && !dpadAbajoPronto) {
            dpadAbajoPronto = true;
            seleccionActual = (seleccionActual + 1) % totalCuadros;
            actualizarMenuVisual();
          } else if (!m.buttons[13] && axisY <= 0.5) {
            dpadAbajoPronto = false;
          }

          if ((m.buttons[12] && m.buttons[12].pressed || axisY < -0.5) && !dpadArribaPronto) {
            dpadArribaPronto = true;
            seleccionActual = (seleccionActual - 1 + totalCuadros) % totalCuadros;
            actualizarMenuVisual();
          } else if (!m.buttons[12] && axisY >= -0.5) {
            dpadArribaPronto = false;
          }
        }
      }
      requestAnimationFrame(bucleMandoPS4);
    }

    window.addEventListener("gamepadconnected", () => {
      bucleMandoPS4();
    });
  </script>
</body>
</html>
