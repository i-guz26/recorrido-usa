<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recorrido VR - Estatua de la Libertad</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    
    #contenedor-vr {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    .ojo-izquierdo, .ojo-derecho {
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    .ojo-izquierdo {
      border-right: 2px solid #000;
    }

    /* Botón flotante inferior para Play / Pausa */
    #boton-control {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 22px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Botón para reproducir y pausar el video -->
  <button id="boton-control" onclick="togglePlayPause()">▶ Reproducir Video</button>

  <div id="contenedor-vr">
    <!-- Vista Ojo Izquierdo -->
    <div class="ojo-izquierdo">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-assets>
          <video id="video-360" src="video1.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>
        <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>

    <!-- Vista Ojo Derecho -->
    <div class="ojo-derecho">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>
  </div>

  <script>
    const video = document.getElementById('video-360');
    const botonControl = document.getElementById('boton-control');

    function togglePlayPause() {
      if (video.paused) {
        video.play().then(() => {
          botonControl.textContent = "⏸ Pausar";
        }).catch(err => console.log("Error al reproducir:", err));
      } else {
        video.pause();
        botonControl.textContent = "▶ Reproducir";
      }

      // Permisos de giroscopio en iOS Safari
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(console.error);
      }
    }

    // Control con el mando de PS4 (El botón X alterna entre Play y Pausa)
    let botonPresionado = false;
    function revisarMando() {
      const gamepads = navigator.getGamepads();
      if (gamepads && gamepads[0]) {
        const mando = gamepads[0];
        const botonX = mando.buttons[0]; 

        if (botonX && botonX.pressed && !botonPresionado) {
          botonPresionado = true;
          togglePlayPause();
        } else if (botonX && !botonX.pressed) {
          botonPresionado = false;
        }
      }
      requestAnimationFrame(revisarMando);
    }

    window.addEventListener("gamepadconnected", () => {
      revisarMando();
    });
  </script>
</body>
</html>
