<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recorrido VR EE.UU.</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    /* Botón flotante personalizado para activar el modo gafas */
    #boton-vr {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99999;
      background: #ff3b30;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Desactivamos el UI nativo de A-Frame para usar nuestro botón -->
  <a-scene vr-mode-ui="enabled: false">
    <a-assets timeout="10000">
      <img id="lugar1" src="foto1.jpg">
      <img id="lugar2" src="foto2.jpg">
      <img id="lugar3" src="foto3.jpg">
    </a-assets>

    <!-- Escena 360 -->
    <a-sky id="fondo-recorrido" src="#lugar1" rotation="0 -90 0"></a-sky>

    <!-- Cámara -->
    <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
  </a-scene>

  <!-- Botón personalizado en pantalla -->
  <button id="boton-vr" onclick="activarVR()">🥽 Modo Gafas VR</button>

  <script>
    // Función para solicitar permisos de movimiento en iOS y forzar modo horizontal/pantalla
    function activarVR() {
      // Solicitar permisos de giroscopio en iOS 13+
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('deviceorientation', () => {});
            }
          })
          .catch(console.error);
      }

      // Forzar rotación en horizontal si el navegador lo permite
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }

      alert("Coloca tu iPhone en horizontal y ponlo dentro de las BOBOVR Z4. Usa la X de tu mando para cambiar de foto.");
    }

    // Control con mando de PS4
    const estaciones = ["#lugar1", "#lugar2", "#lugar3"];
    let indiceActual = 0;
    let botonPresionado = false;

    function revisarMando() {
      const gamepads = navigator.getGamepads();
      if (gamepads && gamepads[0]) {
        const mando = gamepads[0];
        const botonX = mando.buttons[0]; 

        if (botonX && botonX.pressed && !botonPresionado) {
          botonPresionado = true;
          indiceActual = (indiceActual + 1) % estaciones.length;
          document.getElementById("fondo-recorrido").setAttribute("src", estaciones[indiceActual]);
        } else if (botonX && !botonX.pressed) {
          botonPresionado = false;
        }
      }
      requestAnimationFrame(revisarMando);
    }

    window.addEventListener("gamepadconnected", () => {
      revisarMando();
    });
  </script>
</body>
</html>
