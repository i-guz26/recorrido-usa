<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Recorrido VR - EE.UU.</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    
    #contenedor-vr {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    .ojo {
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    .ojo:first-child {
      border-right: 2px solid #000;
    }

    #boton-play {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: #ff3b30;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      cursor: pointer;
    }

    /* Indicador visual de qué video está reproduciéndose */
    #info-video {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      color: white;
      font-family: sans-serif;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 15px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="info-video">Reproduciendo: Video 1</div>
  <button id="boton-play" onclick="iniciarExperiencia()">▶ Toca aquí para iniciar</button>

  <!-- Video con loop desactivado para que pueda detectar el final -->
  <video id="video-360" src="video1.mp4" crossorigin="anonymous" playsinline webkit-playsinline style="display:none;"></video>

  <div id="contenedor-vr">
    <!-- Ojo Izquierdo -->
    <div class="ojo">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>

    <!-- Ojo Derecho -->
    <div class="ojo">
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%;">
        <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
      </a-scene>
    </div>
  </div>

  <script>
    const video = document.getElementById('video-360');
    const botonPlay = document.getElementById('boton-play');
    const infoVideo = document.getElementById('info-video');
    let reproduciendo = false;
    let videoActual = 1; // 1 para video1.mp4, 2 para video2.mp4

    function iniciarExperiencia() {
      if (!reproduciendo) {
        video.play().then(() => {
          reproduciendo = true;
          botonPlay.textContent = "⏸ Pausar Video";
        }).catch(err => {
          console.log("Error al reproducir:", err);
          alert("Asegúrate de que 'video1.mp4' y 'video2.mp4' estén subidos en GitHub.");
        });
      } else {
        if (video.paused) {
          video.play();
          botonPlay.textContent = "⏸ Pausar Video";
        } else {
          video.pause();
          botonPlay.textContent = "▶ Reproducir Video";
        }
      }

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().catch(console.error);
      }
    }

    // Detectar automáticamente cuando termina un video para pasar al siguiente
    video.addEventListener('ended', () => {
      if (videoActual === 1) {
        videoActual = 2;
        video.src = "video2.mp4";
        infoVideo.textContent = "Reproduciendo: Video 2";
        video.play().catch(err => console.log("Error al reproducir video 2:", err));
      } else {
        // Si quieres que vuelva al video 1 en bucle infinito, descomenta la siguiente línea:
        // videoActual = 1; video.src = "video1.mp4"; infoVideo.textContent = "Reproduciendo: Video 1"; video.play();
      }
    });

    // Control con el botón X del mando de PS4
    let botonPresionado = false;
    function revisarMando() {
      const gamepads = navigator.getGamepads();
      if (gamepads && gamepads[0]) {
        const mando = gamepads[0];
        const botonX = mando.buttons[0]; 

        if (botonX && botonX.pressed && !botonPresionado) {
          botonPresionado = true;
          iniciarExperiencia();
        } else if (botonX && !botonX.pressed) {
          botonPresionado = false;
        }
      }
      requestAnimationFrame(revisarMando);
    }

    window.addEventListener("gamepadconnected", () => {
      revisarMando();
    });
  </script>
</body>
</html>
